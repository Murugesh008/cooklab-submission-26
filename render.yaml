services:
  # --- Main app: order intake, orchestrator, auth ---
  - type: web
    name: cooklab-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cooklab-db
          property: connectionString
      # Predictable because Render names services exactly as given below -
      # https://<name>.onrender.com - so these can be hardcoded rather than
      # looked up.
      - key: INVENTORY_SERVICE_URL
        value: https://cooklab-inventory.onrender.com
      - key: CRM_SERVICE_URL
        value: https://cooklab-crm.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://cooklab-notification.onrender.com

  # --- Inventory microservice ---
  - type: web
    name: cooklab-inventory
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.inventory_service.main:app --host 0.0.0.0 --port $PORT

  # --- CRM microservice ---
  - type: web
    name: cooklab-crm
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.crm_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # CRM crashes on startup without this - it has its own JWT auth,
      # separate from the main app's SECRET_KEY.
      - key: CRM_SECRET_KEY
        generateValue: true

  # --- Notification microservice ---
  - type: web
    name: cooklab-notification
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.notification_service.main:app --host 0.0.0.0 --port $PORT

databases:
  - name: cooklab-db
    plan: free